<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#06152e"><title>発音の達人</title><link rel="preload" as="image" type="image/webp" href="./public/assets/english-rhythm-background.webp" fetchpriority="high"><link rel="stylesheet" href="./src/styles.css?v=20261026-17"></head>
<body>
<main class="game" id="game">
  <header class="masthead"><div class="brand"><span class="crest" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>発音の達人</h1></div><div class="stage-heading"><span id="stage-label">STAGE 01 · EASY</span><h2 id="stage-title">秘密の庭へ</h2></div><div class="score-box"><span>SCORE</span><strong id="score">00000</strong><small>BEST <b id="best">—</b></small></div><div class="combo-badge"><span>COMBO</span><b id="combo">000</b></div></header>
  <section class="sentence-panel" aria-label="英文"><div class="sentence-caption">言葉のリズムを、からだで覚えよう。</div><div id="sentence" lang="en"></div></section>
  <div class="lane-top"><span><i class="dot red"></i> 内容語 <i class="dot blue"></i> 機能語</span><span id="mode-status"></span></div>
  <section class="lane" id="lane" aria-label="音符レーン"><div class="lane-lines"></div><div class="target" id="target"><span>✿</span></div><div id="notes"></div><div class="lane-guide">判定円に合わせて叩こう</div></section>
  <div class="progress"><div id="progress-fill"></div></div>
  <section class="instrument" aria-label="太鼓"><div class="keyboard-hint left"><kbd><b>F</b><small>キー</small></kbd><strong>内容語</strong><span>ドンッ</span></div><img class="drum" width="432" height="351" src="./public/assets/drum.webp" alt="桜模様の和太鼓"><img id="stick-left" class="stick left" width="323" height="335" src="./public/assets/drumstick-left.webp" alt=""><img id="stick-right" class="stick right" width="359" height="357" src="./public/assets/drumstick-right.webp" alt=""><div id="feedback" class="feedback" aria-live="polite"></div><div class="keyboard-hint right"><kbd><b>J</b><small>キー</small></kbd><strong>機能語</strong><span>カッ</span></div></section>
  <button class="touch-pad don" id="don" aria-label="内容語 ドンッ"><strong>内容語</strong><span>ドンッ</span></button><button class="touch-pad ka" id="ka" aria-label="機能語 カッ"><strong>機能語</strong><span>カッ</span></button>
  <footer class="controls"><button id="stage-button" class="quiet">☷ ステージ</button><div class="speed"><span>速度</span><div id="speeds" role="group" aria-label="再生速度"><button data-rate="0.25">0.25×</button><button data-rate="0.5" aria-pressed="true" class="selected">0.5×</button><button data-rate="0.75">0.75×</button><button data-rate="1">1.0×</button></div></div><button id="listen" class="quiet" disabled>♫ LISTEN</button><button id="start" class="primary" disabled>準備中…</button><button id="restart" class="quiet" hidden title="開始前に戻ります">↶ やり直す</button></footer>
  <p class="notice" id="notice" role="status"></p>
  <dialog id="stage-dialog"><button class="close" id="close-stage" aria-label="閉じる">×</button><span class="eyebrow">SELECT STAGE</span><div class="stage-list-wrap"><div id="stage-list"></div><div id="stage-scroll-hint" aria-hidden="true">⌄</div></div><button id="choose-stage" class="primary">このステージで練習</button></dialog>
  <dialog id="result-dialog"><span class="eyebrow">PRACTICE COMPLETE</span><h2>おつかれさまでした！</h2><p id="result-mode"></p><strong class="result-score" id="result-score"></strong><div class="result-stats" id="result-stats"></div><div class="dialog-actions"><button id="result-stages" class="quiet">ステージ選択</button><button id="retry" class="primary">↶ 速度を選んでもう一度</button></div></dialog>
</main><aside class="rotate"><span>↻</span><h2>横向きで、リズムに乗ろう。</h2><p>端末を横にすると、太鼓ゲームをプレイできます。</p></aside>
<script type="module" src="./src/main.js?v=20261026-05"></script></body></html>
